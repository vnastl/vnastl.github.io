<header class="site-header">
  <div class="inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="28" height="28">
      <span>{{ site.name }}</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}#about"{% if page.url == "/" %} class="current"{% endif %}>About</a>
      <a href="{{ '/' | relative_url }}#news">News</a>
      <a href="{{ '/' | relative_url }}#publications">Publications</a>
      <a href="{{ '/' | relative_url }}#talks">Talks</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.url == "/cv/" %} class="current"{% endif %}>CV</a>
    </nav>
  </div>
</header>
